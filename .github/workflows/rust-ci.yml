name: Rust CI

on:
  push:
  pull_request:

# Least privilege: correctness CI only reads the checkout — no writes, no creds.
permissions:
  contents: read

# Cancel stale runs on the same ref: a newer push to a branch (or a newer sync
# to a PR) supersedes the in-flight run. A push to a branch that ALSO has an open
# PR still produces one `push` run AND one `pull_request` run — they carry
# different refs (`refs/heads/…` vs `refs/pull/N/merge`), so they fall in
# different groups and both complete. The group uses a stable literal slug rather
# than `${{ github.workflow }}` so renaming the workflow's `name:` cannot orphan
# in-flight runs.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, build, test, doctests
    runs-on: ubuntu-latest
    # Generous bound for a cold-cache run (the bundled-DuckDB C++ compile is the
    # slow path) while still catching a hung job well short of the 6h default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Restore the cargo registry + target cache before any cargo invocation so
      # the toolchain probe and the build/test steps run against a warm cache.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # rustup installs the pinned toolchain and its components (per
      # rust-toolchain.toml) on first cargo use; this step makes that explicit
      # and logs the resolved versions for debugging.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test (nextest)
        run: cargo nextest run --workspace --locked

      # cargo-nextest does not execute doctests, so they run separately here.
      - name: Doctests
        run: cargo test --doc --workspace --locked
