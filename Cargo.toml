[workspace]
members = ["server", "migrate"]
# `resolver = "2"` matches the monorepo pin. Edition 2024 would otherwise default
# to resolver 3; keep this at 2 in sync with the monorepo to avoid feature-resolution
# surprises (revisit when the monorepo upgrades its resolver).
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91.0"
license = "Apache-2.0"

[workspace.dependencies]
# Inlined from the vortex monorepo (ct/bench-v4) [workspace.dependencies] at the
# EXACT upstream pins so the standalone build matches. `vortex-utils` (a
# monorepo-internal crate) is intentionally replaced by a direct `hashbrown`
# dependency — its only use here was the `hashbrown` HashMap/HashSet aliases.
anyhow = "1.0.97"
arrow-array = "58.3"
arrow-buffer = "58.3"
arrow-schema = "58.3"
clap = "4.5"
dashmap = "6.1.0"
futures = { version = "0.3.31", default-features = false }
hashbrown = "0.17.1"
insta = "1.43"
# The `nightly` feature is copied verbatim from the monorepo pin. It gates only a
# WASM-atomics thread-parker (`cfg(all(feature = "nightly", target_family = "wasm", …))`)
# in `parking_lot_core`, so it is a no-op on the non-WASM stable 1.91.0 targets we build —
# verified to compile on stable.
parking_lot = { version = "0.12.3", features = ["nightly"] }
# `default-features = false` suppresses reqwest's default native-tls stack; the explicit
# feature list selects rustls + http2 + blocking (the crates add `json` on top). Copied
# verbatim from the monorepo pin so the TLS path matches RDS verify-full.
reqwest = { version = "0.13.0", features = [
    "blocking",
    "charset",
    "http2",
    "rustls",
    "system-proxy",
], default-features = false }
rstest = "0.26.1"
serde = "1.0.220"
serde_json = "1.0.138"
tempfile = "3"
thiserror = "2.0.3"
tokio = { version = "1.52" }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = "0.3"
