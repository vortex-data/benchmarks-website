[package]
name = "vortex-bench-server"
version = "0.1.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "bench.vortex.dev v3 alpha server: HTTP API + HTML + DuckDB on local disk"
publish = false

[lib]
name = "vortex_bench_server"
path = "src/lib.rs"

[[bin]]
name = "vortex-bench-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
base64 = "0.22"
brotli = "8.0.2"
bytes = "1.11"
dashmap = { workspace = true }
# track vortex-duckdb's bundled engine version (build.rs)
duckdb = { version = "1.10502", features = ["bundled"] }
flate2 = "1"
futures = { workspace = true, features = ["std"] }
hashbrown = { workspace = true }
maud = { version = "0.27", features = ["axum"] }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
subtle = "2.6"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "compression-br",
    "compression-gzip",
    "trace",
] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
twox-hash = "2.1"

[dev-dependencies]
# `filters` enables `Settings::add_filter`, which we use in
# `tests/common/mod.rs` to redact the build SHA from the HTML
# snapshots so they don't churn on every commit.
insta = { workspace = true, features = ["filters"] }
reqwest = { workspace = true, features = ["json"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
